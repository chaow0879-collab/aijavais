name: Independent CodeAudit R51 fixed source
on:
  push:
    branches: [audit/codeaudit-r51-3d69373-20261107]
    paths: [audit-evidence/r51/**, .github/workflows/codeaudit-r51-fixed.yml]
permissions:
  contents: read
jobs:
  independent-offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AIJ_PILOT_LIVE: '0'
      AIJ_AUTO_DISPATCH_ENABLED: 'false'
    steps:
      - name: Read auditor-owned evidence assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: audit-assets
          persist-credentials: false
      - name: Checkout the unique frozen source, never the auditor branch HEAD
        uses: actions/checkout@v4
        with:
          ref: 3d6937348d94e585e44d567de05f14ecd0eb3636
          fetch-depth: 0
          path: reviewed
          persist-credentials: false
      - name: Checkout old R49 source for an offline contrast only
        uses: actions/checkout@v4
        with:
          ref: fcf52ed855dfccacb16cef632d0e3eb202510718
          path: old-r49
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert and record independent source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C reviewed rev-parse HEAD)" = 3d6937348d94e585e44d567de05f14ecd0eb3636
          test "$(git -C reviewed rev-parse 'HEAD^{tree}')" = 510d2fa20055d67aacc64c42d1cdf8a3473f12fd
          { git -C reviewed show -s --format='%H %P %T' HEAD; node --version; git --version; } | tee evidence/source.txt
      - name: Independent 30 V2 authorization and unknown-fee assertions
        shell: bash
        env:
          REVIEWED_ROOT: ${{ github.workspace }}/reviewed
        run: |
          set -euo pipefail
          node audit-assets/audit-evidence/r51/independent-v2.cjs | tee evidence/independent-v2.log
      - name: Independent security, provenance and real-Git probes
        if: success() || failure()
        shell: bash
        env:
          REVIEWED_ROOT: ${{ github.workspace }}/reviewed
          OLD_R49_ROOT: ${{ github.workspace }}/old-r49
          AUDIT_OUT: ${{ github.workspace }}/evidence/independent-r51.json
        run: |
          set -euo pipefail
          node audit-assets/audit-evidence/r51/independent-r51.cjs | tee evidence/independent-r51.log
      - name: Independent re-execution of the frozen 865-test E2/E3 suite
        if: success() || failure()
        working-directory: reviewed
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/agent-scheduler/*.test.js tests/agent-executor/*.test.js tests/agent-pilot-r45/*.test.js tests/auto-handoff-r46/*.test.js tests/first-handoff-r49/*.test.js tests/trusted-trigger-r50/*.test.js tests/first-pilot-r51/*.test.js | tee ../evidence/frozen-suite.log
          test "$(git rev-parse HEAD)" = 3d6937348d94e585e44d567de05f14ecd0eb3636
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Preserve independent evidence (never raw credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-codeaudit-r51-3d69373
          path: evidence/
          retention-days: 14
          if-no-files-found: error
