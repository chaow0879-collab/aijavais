name: Agent scheduler V1 readonly validation
# C1 (2026-11-11): relay line frozen. Manual dispatch only, at ref claude/relay-r57-final (the last commit
# before relay code moved to tools/relay/). Product CI is .github/workflows/product.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/agent-scheduler/*.test.js
      - name: Default entry stays off without GitHub calls
        run: node tools/agent-scheduler/cli.js
