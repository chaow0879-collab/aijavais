name: AUDIT CodeAudit fe6c48a (independent, read-only, AUD-B1)
# Independent-CodeAudit evidence only. MOCK/pure tests; no secrets, no paid models, no deploy, no schedule.
on:
  push:
    branches: [audit/fe6c48a-20261110]
    paths: [audit-evidence/fe6c48a/**, .github/workflows/audit-fe6c48a.yml]
permissions:
  contents: read
concurrency: { group: audit-fe6c48a, cancel-in-progress: false }
env:
  REVIEWED_SHA: fe6c48a117c82eecfd9d3e59ecc68cf27dbeb1b3
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { path: audit, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { ref: fe6c48a117c82eecfd9d3e59ecc68cf27dbeb1b3, path: reviewed, fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install poppler and LibreOffice (npm test needs them)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui
      - name: Install Office parsers used by npm test
        run: python3 -m pip install --user python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2
      - name: Provenance
        run: |
          set -eu
          test "$(git -C reviewed rev-parse HEAD)" = "$REVIEWED_SHA"
          node --version; mkdir -p "$RUNNER_TEMP/out"
          echo "reviewed=$(git -C reviewed rev-parse HEAD) tree=$(git -C reviewed rev-parse HEAD^{tree}) audit=$(git -C audit rev-parse HEAD)" | tee "$RUNNER_TEMP/out/source.txt"
      - name: "1 Independent probes + mutations (auditor-written)"
        if: success() || failure()
        env: { REVIEWED_ROOT: "${{ github.workspace }}/reviewed", AUDIT_OUT: "${{ runner.temp }}/out" }
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=tap audit/audit-evidence/fe6c48a/independent.test.cjs | tee "$RUNNER_TEMP/out/independent.tap"
      - name: "2 tests/reasoning.test.js in reviewed tree"
        if: success() || failure()
        working-directory: reviewed
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/reasoning.test.js | tee "$RUNNER_TEMP/out/reasoning.tap"
      - name: "3 npm test in reviewed tree"
        if: success() || failure()
        working-directory: reviewed
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/all.test.js | tee "$RUNNER_TEMP/out/npm-test.tap" | grep -E '^# (tests|pass|fail|skipped) |^not ok'
      - name: "4 Provenance guard at reviewed HEAD"
        if: success() || failure()
        working-directory: reviewed
        run: node tools/unattended-go-r57/sources.js | tee "$RUNNER_TEMP/out/sources-verify.json" | grep -A3 violations
      - name: "5 Reviewed tree unchanged"
        if: success() || failure()
        run: git -C reviewed status --porcelain | tee "$RUNNER_TEMP/out/reviewed-status.txt"; test ! -s "$RUNNER_TEMP/out/reviewed-status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: audit-fe6c48a-evidence, path: "${{ runner.temp }}/out", retention-days: 30 }
