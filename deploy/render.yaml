# Optional PAID Render deployment blueprint (starter plan + 1 GB disk). Do not Apply without cost approval.
# Kept out of the repository root on purpose (B2-prep): Render reads ./render.yaml by default, and a Render
# service created earlier from main's old free blueprint (which auto-deployed) could otherwise be synced to
# this paid plan when main is fast-forwarded. To use it after the owner approves the cost: `git mv deploy/render.yaml render.yaml`
# (or point the Render blueprint at deploy/render.yaml) and Apply manually in the Render console.
# Render terminates HTTPS; access to the app must go through its ingress.
services:
  - type: web
    name: aijavais-v2
    runtime: docker
    plan: starter
    autoDeploy: false
    healthCheckPath: /healthz
    disk:
      name: aijavais-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8787"
      - key: AIJ_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: AIJ_DATA_DIR
        value: /data
