# Optional paid Render deployment blueprint. Do not Apply without cost approval.
# Render terminates HTTPS; access to the app must go through its ingress.
services:
  - type: web
    name: aijavais-v2
    runtime: docker
    plan: starter
    autoDeploy: false
    healthCheckPath: /healthz
    disk:
      name: aijavais-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8787"
      - key: AIJ_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: AIJ_DATA_DIR
        value: /data
