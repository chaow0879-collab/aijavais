<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AIJAVAIS｜项目立项智能向导</title>
  <style>
  :root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e9f7ff;background:#08111f;--bg:#08111f;--card:#101e30;--line:#29445b;--accent:#55e7ff;--accent2:#9b88fa;--sub:#a7bdca;--good:#8de3c1;--warn:#ffd298}
  *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 45% -20%,#1a3e66 0%,transparent 55%),radial-gradient(ellipse at 100% 10%,#182145 0%,transparent 30%),var(--bg);min-height:100vh}
  a{color:var(--accent)}header{border-bottom:1px solid #284056;background:rgba(8,17,31,.85);position:sticky;top:0;z-index:10;backdrop-filter:blur(16px)}
  .top{max-width:1370px;margin:auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:21px;letter-spacing:.16em;font-weight:800}.brand span{color:var(--accent)}.meta{color:#99b4c7;font-size:12px;letter-spacing:.12em}
  .shell{max-width:1370px;padding:40px 28px 64px;margin:auto;display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px}
  .side,.main,.mini{border:1px solid var(--line);background:linear-gradient(145deg,rgba(15,31,52,.94),rgba(12,22,39,.96));box-shadow:0 15px 50px rgba(0,0,0,.2);border-radius:20px}
  .side{align-self:start;padding:22px;position:sticky;top:100px}.sideTitle{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700}.side ol{list-style:none;padding:0;margin:20px 0}.side li{padding:13px 12px;margin:6px 0;border-radius:12px;color:#8aa8bc;font-size:14px;display:flex;gap:12px;align-items:center}.side li .n{display:grid;place-items:center;border:1px solid #34536d;border-radius:50%;width:25px;height:25px;font-size:12px;flex:none}.side li.active{color:white;background:#19364e;border:1px solid #367e97}.side li.active .n{border-color:var(--accent);color:var(--accent)}.side li.done{color:var(--good)}.note{border:1px solid #355062;background:#11293c;border-radius:12px;padding:13px;color:#9ec0d0;font-size:12px;line-height:1.7}
  .main{min-height:710px;padding:32px 36px}.eyebrow{font-size:12px;letter-spacing:.21em;color:var(--accent);font-weight:700}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;border-bottom:1px solid #29445b;padding-bottom:25px}.head h1{margin:12px 0;font-size:clamp(26px,3vw,37px);line-height:1.22}.head p{color:var(--sub);line-height:1.7;margin:8px 0}.stepno{white-space:nowrap;font-size:12px;border:1px solid #315b71;color:var(--accent);padding:9px 13px;border-radius:100px}
  .body{padding-top:26px;min-height:410px}.label{display:block;margin:18px 0 8px;font-size:13px;font-weight:700;color:#d2ebf6}.hint,.detail{font-size:12px;color:#95aebf;line-height:1.75}.hint{margin:6px 0 13px}.field{margin-bottom:16px}textarea,input[type=text],select{width:100%;background:#0a1b2b;border:1px solid #31536a;border-radius:11px;padding:13px 14px;font:inherit;font-size:14px;color:#e7f8fe;outline:none}textarea{min-height:130px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:#54d6ed;box-shadow:0 0 0 2px #48d4ea22}option{color:#eaf8ff;background:#13263a}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #29485f;background:#0b1c2d;border-radius:15px;padding:17px}.card h3{font-size:16px;margin:0 0 7px}.card p{font-size:13px;line-height:1.7;margin:4px 0;color:#a5bdcc}.choice{cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit;transition:all .15s}.choice:hover{border-color:#5fc4da;transform:translateY(-1px)}.choice.selected{border-color:#49e0f4;background:#123448;box-shadow:inset 0 0 0 1px #39c1d744}.pill{display:inline-block;font-size:11px;border:1px solid #42738b;color:#9edcec;border-radius:20px;padding:3px 9px;margin-top:10px}.pill.warn{border-color:#a67942;color:#ffd99d}.pill.good{border-color:#42796c;color:#a2ecd4}
  .roleTop{display:flex;align-items:flex-start;gap:12px}.roleTop input{margin:5px 0 0;accent-color:#48e0f4;width:18px;height:18px;flex:none}.roleMeta{flex:1;min-width:0}.roleMeta strong{font-size:15px}.roleStand{border-left:2px solid #42677d;padding-left:10px;margin-top:12px;color:#aed2df;font-size:12px;line-height:1.7}
  .roleModel{margin-top:13px}.roleModel label{font-size:12px;color:#9fbbc9;display:block;margin-bottom:6px}.roleModel select{padding:10px;font-size:13px}.roleModel small{display:block;margin-top:6px;color:#93c8b7;font-size:11px}
  .item{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid #274459;padding:18px 0}.item:last-child{border:none}.item input{accent-color:#56e5f7;width:18px;height:18px;margin-top:3px}.item h3{font-size:15px;margin:0 0 5px}.item p{font-size:12px;line-height:1.7;color:#aac4d2;margin:3px 0}
  .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #29445b;margin-top:28px;padding-top:23px}.btn{border:1px solid #3b6a83;background:#123047;color:#e5faff;min-height:42px;border-radius:10px;padding:10px 17px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}.btn:hover{background:#1b4b62}.btn.primary{color:#082133;background:linear-gradient(110deg,#56e7f7,#8bcff7);border:0}.btn.primary:hover{filter:brightness(1.08)}.btn:disabled{opacity:.4;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:10px}.error{padding:12px;border:1px solid #985854;border-radius:10px;background:#452628;color:#ffcece;display:none;margin-bottom:18px}.error.show{display:block}.warnbox{border:1px solid #927b4c;background:#322c20;border-radius:11px;padding:15px;color:#ffe0a7;line-height:1.75;font-size:13px;margin:15px 0}.success{color:#a9f2d9}.muted{color:var(--sub)}.result{background:#071522;color:#d5f1fc;padding:17px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.8;border:1px solid #315168;border-radius:12px;max-height:380px;overflow:auto}.status{display:flex;gap:13px;align-items:center;margin:18px 0}.status .light{width:11px;height:11px;border-radius:50%;background:#ffcc80;box-shadow:0 0 15px #ffcc8080}.status .light.ok{background:#6be3ba;box-shadow:0 0 15px #6be3ba80}
  .small{font-size:12px}.spacer{height:12px}.full{grid-column:1 / -1}
  @media(max-width:940px){.shell{grid-template-columns:1fr;padding:20px 14px}.side{position:static}.side ol{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.side li{font-size:11px;padding:8px;gap:5px}.side li .n{width:20px;height:20px}.main{padding:24px 18px}}@media(max-width:600px){.grid{grid-template-columns:1fr}.head{display:block}.stepno{display:inline-block}.top{padding:15px}.side ol{grid-template-columns:repeat(2,1fr)}}
  </style>
  <script src="/project-intake/engine.js" defer></script>
  <script src="/project-intake/app.js" defer></script>
</head>
<body>
<header><div class="top"><div class="brand">AI<span>JAVAIS</span> <span style="font-size:11px;color:#91a7ba;letter-spacing:.05em">/ PROJECT LAB</span></div><div class="meta">PROJECT INTAKE · 智能立项向导 v1.0</div></div></header>
<main class="shell">
  <aside class="side"><div class="sideTitle">PROJECT SETUP / 项目设立</div><ol id="steps-nav">
    <li class="active"><span class="n">01</span>任务目标</li><li><span class="n">02</span>项目类型</li><li><span class="n">03</span>量化标准</li><li><span class="n">04</span>岗位分工</li><li><span class="n">05</span>执行流程</li><li><span class="n">06</span>方案与提示词</li>
  </ol><div class="note">◈ 这里帮助你决定“项目需要谁、遵循什么流程、用什么工具、按什么标准验收”。<br><br>所有岗位都能增加或删减。生成立项计划 ≠ 任务已执行。</div></aside>
  <section class="main">
    <div class="head"><div><div class="eyebrow">AI PROJECT INTELLIGENCE</div><h1 id="step-title">正在载入智能向导</h1><p id="step-intro">根据你的任务自动建议工作团队与交付标准。</p></div><div class="stepno" id="step-badge">STEP 01 / 06</div></div>
    <div class="body"><div class="error" role="alert" id="error"></div><div id="step-content"><p class="muted">正在加载项目目录…</p></div></div>
    <div class="toolbar"><button class="btn" id="back" type="button">← 返回上一步</button><div class="actions"><button class="btn" id="reset" type="button">重置</button><button class="btn primary" id="next" type="button">下一步 →</button></div></div>
  </section>
</main>
</body></html>
