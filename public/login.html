<!doctype html>
<!-- AIJAVAIS 前台登录页（B8：使用者账号，用户名 + 密码；管理员走 /admin-login.html）。视觉沿用 HALOFLUX（Copyright (c) 2026 Ryder191，PolyForm Noncommercial 1.0.0）的配色风格。 -->
<html lang="zh-CN">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%2398e0cf' stroke-width='3'/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIJAVAIS 登录</title>
<style>
:root{--bg:#08090b;--panel:#0e0f12;--line:#25282e;--line2:#3a3e46;--text:#cfd2d8;--dim:#8a8f99;--white:#f4f5f7;--teal:#98e0cf;--red:#ff7b7b;--gold:#d6c46a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.6 "JetBrains Mono",Consolas,"Microsoft YaHei",monospace}
body{display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:400px;border:1px solid var(--line);background:var(--panel);padding:26px 26px 22px}
h1{margin:0 0 4px;font-size:20px;color:var(--white);letter-spacing:2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--text);background:#141519;border:1px solid var(--line2);padding:9px 10px;border-radius:3px}
input:focus{outline:1px solid var(--teal)}
button{width:100%;margin-top:18px;font:inherit;font-weight:700;background:#cfd2d8;color:#000;border:1px solid #cfd2d8;padding:10px;border-radius:3px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.msg{min-height:20px;margin-top:12px;font-size:12px}
.bad{color:var(--red)}.ok{color:var(--teal)}.warn{color:var(--gold)}
.note{color:var(--dim);font-size:11px;margin-top:14px}.note a{color:var(--teal)}
.hidden{display:none}
</style>
</head>
<body>
<div class="box">
  <h1>AIJAVAIS</h1>
  <div class="sub" id="sub">登录后在这里新建任务、查看进度、下载成果</div>

  <form id="userForm" autocomplete="on">
    <label for="un">用户名</label>
    <input id="un" autocomplete="username" required autofocus maxlength="32">
    <label for="upw">密码</label>
    <input id="upw" type="password" autocomplete="current-password" required maxlength="200">
    <button id="userBtn" type="submit">登录</button>
  </form>

  <div class="msg" id="msg"></div>
  <p class="note" id="httpsNote"></p>
  <p class="note">忘记密码或还没有账号？请联系管理员。</p>
  <p class="note">管理员请到 <a href="/admin-login.html" id="to-admin">管理后台登录</a>。</p>
</div>
<script>
const $ = s => document.querySelector(s);
const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/workspace.html'; return /^\/(?!\/)[\w./-]*$/.test(n) ? n : '/workspace.html'; })();
const msg = (t, c = 'bad') => { $('#msg').className = 'msg ' + c; $('#msg').textContent = t; };
(async () => {
  const s = await fetch('/api/auth/status', { credentials: 'same-origin' }).then(r => r.json()).catch(() => null);
  if (!s) return msg('无法连接服务器');
  if (s.loggedIn && (s.kind === 'user' || s.kind === 'admin')) return location.replace(next);
  if (!s.setup) msg('系统还没有完成初始设置，请管理员先到管理后台设置密码。', 'warn');
  if (!s.https && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') $('#httpsNote').innerHTML = '<span class="bad">当前连接未加密（HTTP），密码可能被同一网络中的人截获。公网使用请启用 HTTPS。</span>';
})();
$('#userForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#userBtn').disabled = true; msg('');
  const r = await fetch('/api/auth/user-login', { method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ username: $('#un').value, password: $('#upw').value }) });
  const j = await r.json().catch(() => ({}));
  $('#userBtn').disabled = false;
  if (r.ok) { msg('登录成功', 'ok'); location.replace(next); } else { msg(j.error || '登录失败'); $('#upw').select(); }
});
</script>
</body>
</html>
