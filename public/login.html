<!doctype html>
<!-- AIJAVAIS 登录页。视觉沿用 HALOFLUX（Copyright (c) 2026 Ryder191，PolyForm Noncommercial 1.0.0）的配色风格。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIJAVAIS 登录</title>
<style>
:root{--bg:#08090b;--panel:#0e0f12;--line:#25282e;--line2:#3a3e46;--text:#cfd2d8;--dim:#8a8f99;--white:#f4f5f7;--teal:#98e0cf;--red:#ff7b7b;--gold:#d6c46a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.6 "JetBrains Mono",Consolas,"Microsoft YaHei",monospace}
body{display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:400px;border:1px solid var(--line);background:var(--panel);padding:26px 26px 22px}
h1{margin:0 0 4px;font-size:20px;color:var(--white);letter-spacing:2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--text);background:#141519;border:1px solid var(--line2);padding:9px 10px;border-radius:3px}
input:focus{outline:1px solid var(--teal)}
button{width:100%;margin-top:18px;font:inherit;font-weight:700;background:#cfd2d8;color:#000;border:1px solid #cfd2d8;padding:10px;border-radius:3px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.msg{min-height:20px;margin-top:12px;font-size:12px}
.bad{color:var(--red)}.ok{color:var(--teal)}.warn{color:var(--gold)}
.note{color:var(--dim);font-size:11px;margin-top:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="box">
  <h1>AIJAVAIS</h1>
  <div class="sub" id="sub">个人 AI 团队工作平台</div>

  <form id="loginForm" class="hidden" autocomplete="on">
    <label for="pw">管理员密码</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="loginBtn" type="submit">登录</button>
  </form>

  <form id="setupForm" class="hidden" autocomplete="off">
    <p class="warn" style="font-size:12px;margin:0">首次使用：请设置管理员密码。</p>
    <label for="code">一次性设置码（在服务器启动窗口或 data/setup-code.txt 中）</label>
    <input id="code" placeholder="XXXX-XXXX-XXXX" required>
    <label for="np">新密码（至少 10 个字符）</label>
    <input id="np" type="password" autocomplete="new-password" required minlength="10">
    <label for="np2">再输入一次</label>
    <input id="np2" type="password" autocomplete="new-password" required minlength="10">
    <button id="setupBtn" type="submit">设置密码并登录</button>
  </form>

  <div class="msg" id="msg"></div>
  <p class="note" id="httpsNote"></p>
  <p class="note">忘记密码：在服务器本机运行 <code>node tools/reset-password.js --yes</code>，用新的设置码重新设置。</p>
</div>
<script>
const $ = s => document.querySelector(s);
const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/admin.html'; return /^\/(?!\/)[\w./-]*$/.test(n) ? n : '/admin.html'; })();
const msg = (t, c = 'bad') => { $('#msg').className = 'msg ' + c; $('#msg').textContent = t; };
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' });
  return { ok: r.ok, j: await r.json().catch(() => ({})) };
}
(async () => {
  const s = await fetch('/api/auth/status', { credentials: 'same-origin' }).then(r => r.json()).catch(() => null);
  if (!s) return msg('无法连接服务器');
  if (s.loggedIn && s.kind === 'admin') return location.replace(next);
  if (!s.https && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') $('#httpsNote').innerHTML = '<span class="bad">当前连接未加密（HTTP），密码可能被同一网络中的人截获。公网使用请启用 HTTPS。</span>';
  $(s.setup ? '#loginForm' : '#setupForm').classList.remove('hidden');
  (s.setup ? $('#pw') : $('#code')).focus();
})();
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginBtn').disabled = true; msg('');
  const { ok, j } = await post('/api/auth/login', { password: $('#pw').value });
  $('#loginBtn').disabled = false;
  if (ok) { msg('登录成功', 'ok'); location.replace(next); } else { msg(j.error || '登录失败'); $('#pw').select(); }
});
$('#setupForm').addEventListener('submit', async e => {
  e.preventDefault(); msg('');
  if ($('#np').value !== $('#np2').value) return msg('两次输入的密码不一致');
  $('#setupBtn').disabled = true;
  const { ok, j } = await post('/api/auth/setup', { code: $('#code').value, password: $('#np').value });
  $('#setupBtn').disabled = false;
  if (ok) { msg('已设置，正在进入…', 'ok'); location.replace(next); } else msg(j.error || '设置失败');
});
</script>
</body>
</html>
